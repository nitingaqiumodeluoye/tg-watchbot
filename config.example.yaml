http:
  timeout_seconds: 20
  user_agent: Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko)
    Chrome/124.0 Safari/537.36 tg-watchbot/1.0
monitoring:
  cf_bypass_url: http://127.0.0.1:18001
  quiet_hours:
    enabled: true
    start: '01:00'
    end: '07:00'
    timezone: Asia/Shanghai
bot:
  rate_limit:
    window_seconds: 10
    max_messages: 3
  spam_filter:
    enabled: false
    auto_block: true
    keywords:
    - 投资
    - 博彩
    - 空投
  quick_replies:
  - title: 已收到
    text: 你好，消息已收到，我稍后处理。
monitors:
- name: Linux.do 最新
  type: rss
  url: https://linux.do/latest.rss
  interval_seconds: 60
  keywords:
  - API
  - 教程
  - 开源
  exclude_keywords: []
  authors: []
  categories: []
  notify_on:
    keyword_match: true
    new_item: true
    price_change: false
    stock_change: false
  notify_telegram: true
  forum: true
- name: Linux.do 福利
  type: json
  url: https://linux.do/c/welfare/36.json
  cf_bypass: true
  interval_seconds: 60
  keywords:
  - API
  - 教程
  - 开源
  - 公益
  - cdk
  - 免费
  - 福利
  exclude_keywords: []
  authors: []
  categories: []
  notify_on:
    keyword_match: true
    new_item: true
    price_change: false
    stock_change: false
  notify_telegram: true
  forum: true
group_monitors:
- name: TG 群关键词监听示例
  enabled: false
  listen_source: bot
  chat_id: -1001234567890
  keywords:
  - VPS
  - 优惠
  exclude_keywords:
  - 求带
  notify_telegram: true
  summary_mode: template
  ai_base_url: ''
  ai_api_key: ''
  ai_model: gpt-4o-mini
  ai_interface: responses
  ai_temperature: 0.2
  ai_timeout_seconds: 30
  ai_prompt: ''
  ai_min_interval_seconds: 30
  ai_dedupe_window_seconds: 300
cleanup:
  enabled: true
  interval_minutes: 60
  monitor_message_delete_after_minutes: 60
  monitor_retention_minutes: 1440
