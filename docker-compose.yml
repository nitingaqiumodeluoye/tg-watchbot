services:
  tg-watchbot:
    build: .
    container_name: tg-watchbot
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      WEB_PANEL_HOST: "127.0.0.1"
      TELEGRAM_PROXY_URL: ${TELEGRAM_PROXY_URL:-${HTTPS_PROXY:-${https_proxy:-${HTTP_PROXY:-${http_proxy:-}}}}}
      HTTP_PROXY: ${HTTP_PROXY:-${http_proxy:-}}
      HTTPS_PROXY: ${HTTPS_PROXY:-${https_proxy:-}}
      ALL_PROXY: ""
      all_proxy: ""
      NO_PROXY: ${NO_PROXY:-${no_proxy:-localhost,127.0.0.1,::1}}
    volumes:
      - ./.env:/app/.env
      - ./config.yaml:/app/config.yaml
      - ./tg-watchbot.sqlite3:/app/tg-watchbot.sqlite3
      - ./tg-watchbot.log:/app/tg-watchbot.log
